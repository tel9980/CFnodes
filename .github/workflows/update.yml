name: Auto Scrape Nodes

on:
  schedule:
    - cron: "0 */12 * * *"   # 每 12 小时一次：UTC 00:00 / 12:00 = 北京时间 08:00 / 20:00
  workflow_dispatch:       # 也可在 Actions 页面手动点 Run workflow

permissions:
  contents: write

# 同一时间只允许一个抓取任务，避免两次运行互相覆盖
concurrency:
  group: scrape-nodes
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 滚动提交需要完整的父提交信息

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: python -m pip install -q -r requirements.txt

      - name: Run scraper
        env:
          SUB_PASSWORD: ${{ secrets.SUB_PASSWORD }}   # 未配置则跳过加密输出
        run: python scraper.py

      - name: Show summary
        if: always()
        run: |
          if [ -f output/summary.md ]; then
            cat output/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit (rolling)
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"

          rm -f output/encrypted_sub.txt   # 历史遗留的旧加密文件，密码已废弃
          git add -A output

          if git diff --cached --quiet; then
            echo "输出无变化，跳过提交"
            exit 0
          fi

          MSG="chore: 节点滚动更新 $(date -u +%FT%TZ)"
          LAST=$(git log -1 --pretty=%s)
          if [ "${LAST#chore: 节点滚动更新}" != "$LAST" ]; then
            git commit -q --amend -m "$MSG"     # 上一次就是滚动提交 → 原地覆盖，历史不再增长
          else
            git commit -q -m "$MSG"
          fi

          git push --force origin HEAD:main
